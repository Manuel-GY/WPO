<div class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="{{ url_for('dashboard') }}">
            <img class="logo-img" src="{{ url_for('static', filename='img/goodyear.svg') }}" alt="Goodyear">
            <span class="brand-text">
                <span class="logo-sub til">Entrega de Turno</span>
                <span class="logo-sub">Inspección WPO · ASRS</span>
            </span>
        </a>
        <div class="nav-flex">
            <nav class="topnav">
                <a href="{{ url_for('inspeccion') }}" class="nav-form">Formulario</a>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
            </nav>
            <!-- Botón de acceso discreto -->
            <button class="login-icon" onclick="abrirLogin()" title="Acceso de administración LDAP">
                {% if session.get('username') %}
                    <span class="dot-on"></span>
                {% else %}
                    <span class="dot-off"></span>
                {% endif %}
            </button>
        </div>
    </div>
</div>

<!-- Modal de login LDAP -->
<div id="loginModal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-head">
            <h3>Acceso de administración</h3>
            <button type="button" class="modal-close" onclick="cerrarLogin()">&times;</button>
        </div>
        {% if session.get('username') %}
            <form onsubmit="cerrarSesion(event)">
                <p class="subtitle small">Sesión activa: <strong>{{ session.get('username') }}</strong> ({{ session.get('full_name') }})</p>
                <button type="submit" class="btn block">Cerrar sesión</button>
            </form>
        {% else %}
            <form id="loginForm" onsubmit="handleLogin(event)">
                <label>Usuario LDAP (ej. AC17157)
                    <input type="text" id="ldapUser" required placeholder="usuario">
                </label>
                <label>Contraseña
                    <input type="password" id="ldapPass" required placeholder="••••••••">
                </label>
                <p id="ldapError" class="error hidden"></p>
                <button type="submit" id="ldapSubmitBtn" class="btn block">Ingresar</button>
            </form>
        {% endif %}
    </div>
</div>

<script>
    function abrirLogin() { document.getElementById('loginModal').classList.remove('hidden'); }
    function cerrarLogin() { document.getElementById('loginModal').classList.add('hidden'); }

    function cerrarSesion(e) {
        if (e) e.preventDefault();
        document.getElementById('loginModal').classList.add('hidden');
        fetch('/logout', { method: 'POST' }).then(() => window.location.reload());
    }

    async function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('ldapUser').value.toLowerCase();
        const pass = document.getElementById('ldapPass').value;
        const btn = document.getElementById('ldapSubmitBtn');
        const err = document.getElementById('ldapError');

        btn.innerHTML = 'Autenticando...';
        btn.disabled = true;
        err.classList.add('hidden');

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username: user, password: pass })
            });
            const data = await res.json();
            if (res.ok && data.ok) {
                window.location.reload();
            } else {
                err.textContent = data.error || 'Credenciales inválidas.';
                err.classList.remove('hidden');
            }
        } catch (er) {
            err.textContent = 'Error de conexión con el servidor LDAP.';
            err.classList.remove('hidden');
        } finally {
            btn.innerHTML = 'Ingresar';
            btn.disabled = false;
        }
    }

    document.addEventListener('click', function (e) {
        const m = document.getElementById('loginModal');
        if (e.target === m) cerrarLogin();
    });
</script>
